name: Auto Close Unvouched PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest

    steps:
      - name: Check vouch and close unvouched PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"].includes(pr.author_association)) {
              core.info(`User is ${pr.author_association}, skipping vouch check`);
              return;
            }

            if (!/^[0-9a-f]{40}$/i.test(context.sha)) {
              throw new Error("Expected an immutable trusted workflow commit SHA");
            }

            const { data } = await github.rest.repos.getContent({
              ...context.repo,
              path: ".github/VOUCHED.md",
              // pull_request_target supplies the trusted default-branch commit, never the PR head.
              ref: context.sha
            });
            if (!data || data.type !== "file" || data.encoding !== "base64" || typeof data.content !== "string") {
              throw new Error("Expected .github/VOUCHED.md to be a base64-encoded file");
            }

            const author = pr.user.login;
            const vouched = Buffer.from(data.content, "base64").toString("utf8")
              .split(/\r?\n/)
              .some(line => line.trim().toLowerCase() === `@${author.toLowerCase()}`);
            if (vouched) {
              core.info(`@${author} is vouched`);
              return;
            }

            const prNumber = pr.number;
            const message =
              "Thanks for the contribution, @" + author + "!\n\n" +
              "This repository uses a vouch system.\n\n" +
              "PRs from non-vouched users are automatically closed.\n\n" +
              "To contribute:\n" +
              "1. Open a Discussion under Vouch Request\n" +
              "2. Wait for approval\n" +
              "3. Then open your PR\n\n" +
              "Thank you!";

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: message
            });
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: prNumber,
              state: "closed"
            });
